<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scenri v6 · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --r-card:14px; --r-tile:10px; --r-bar:18px;
    --gold:#f5c518; --gold-ink:#191300;
  }
  [data-theme="light"]{
    --bg:#ffffff; --panel:#ffffff; --raised:#f6f6f6; --line:#e8e8e8; --line-strong:#d4d4d4;
    --fg:#0a0a0a; --fg2:#666666; --fg3:#9a9a9a;
    --inv-bg:#0a0a0a; --inv-fg:#ffffff; --hover:#f4f4f4; --scrim:rgba(255,255,255,.72);
    --star:#c9980f;
  
    --sb:rgba(10,10,10,.18); --sb-hover:rgba(10,10,10,.34);
  }
  [data-theme="dark"]{
    --bg:#0d0d0d; --panel:#141414; --raised:#1a1a1a; --line:#262626; --line-strong:#383838;
    --fg:#f5f5f5; --fg2:#9a9a9a; --fg3:#6b6b6b;
    --inv-bg:#f5f5f5; --inv-fg:#0d0d0d; --hover:#1c1c1c; --scrim:rgba(13,13,13,.72);
    --star:#f5c518;
  
    --sb:rgba(245,245,245,.20); --sb-hover:rgba(245,245,245,.36);
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 'Inter Tight',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;cursor:pointer}
  svg{display:block}

  /* ---------- scrollbars: part of the page, never louder than it ----------
     Thin, no track, thumb tinted from the theme's own line color and only
     fully visible while the pointer is over the scrollable area. Firefox gets
     the same treatment through scrollbar-color. */
  *{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--sb);border-radius:999px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--sb-hover);background-clip:content-box}


  /* ---------- top bar: logo left, centered pill nav, credits right ---------- */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;height:60px;padding:0 20px;background:var(--bg)}
  .wordmark{font:600 15px 'Inter Tight';letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .brand-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12.5px}
  .brand-pill:hover{background:var(--hover)}
  .brand-dot{width:9px;height:9px;border-radius:3px;background:#f5a623}
  .nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
  .nav button{border:none;background:none;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:500;color:var(--fg2)}
  .nav button:hover{color:var(--fg)}
  .nav button[data-active]{background:var(--inv-bg);color:var(--inv-fg);font-weight:600}
  .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .credits{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:none;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-weight:650;font-size:12.5px}
  .credits:hover{filter:brightness(1.05)}
  .coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff3b0, #f0b90b 60%, #a67c00);box-shadow:inset 0 0 0 1.5px rgba(120,86,0,.55)}
  .icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg2)}
  .icon-btn:hover{background:var(--hover);color:var(--fg)}

  main{max-width:1200px;margin:0 auto;padding:28px 24px 140px}

  /* ---------- greeting + quick create ---------- */
  .greet{font:600 30px/1.15 'Inter Tight';letter-spacing:-.02em;margin:14px 0 22px}
  .greet em{font:500 italic 33px 'Playfair Display';letter-spacing:0}
  .create{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:36px}
  .create-card{display:flex;align-items:center;gap:12px;padding:15px 16px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--panel);text-align:left;transition:border-color .12s,background .12s}
  .create-card:hover{border-color:var(--line-strong);background:var(--hover)}
  .glyph{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
  .create-card b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
  .create-card small{color:var(--fg2);font-size:12px}

  /* ---------- templates carousel ---------- */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .sec-title{font:600 15px 'Inter Tight';letter-spacing:-.01em}
  .sec-link{border:none;background:none;color:var(--fg2);font-size:12.5px}
  .sec-link:hover{color:var(--fg)}
  .tpl-row{display:grid;grid-auto-flow:column;grid-auto-columns:218px;gap:12px;overflow-x:auto;padding-bottom:6px;margin-bottom:34px;scrollbar-width:none}
  .tpl-row::-webkit-scrollbar{display:none}
  .tpl{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--panel);text-align:left;padding:0;transition:border-color .12s}
  .tpl:hover{border-color:var(--line-strong)}
  .tpl img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
  .tpl .m{padding:10px 12px 11px;display:flex;align-items:center;justify-content:space-between}
  .tpl b{font-size:12.5px;font-weight:600}
  .tpl small{color:var(--fg3);font-size:11px;text-transform:uppercase;letter-spacing:.07em}

  /* ---------- feed tabs + masonry ---------- */
  .tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tabs button{border:none;background:none;padding:0 2px 10px;font-size:13px;color:var(--fg2);border-bottom:1.5px solid transparent;margin-bottom:-1px}
  .tabs button:hover{color:var(--fg)}
  .tabs button[data-active]{color:var(--fg);font-weight:600;border-bottom-color:var(--fg)}
  .masonry{columns:4 240px;column-gap:12px}
  .cell{position:relative;break-inside:avoid;margin-bottom:12px;border-radius:var(--r-tile);overflow:hidden;border:1px solid var(--line);background:var(--raised);padding:0;display:block;width:100%}
  .cell img{width:100%;display:block}
  .cell:hover img{opacity:.92}
  .cell .hover-meta{position:absolute;inset-inline:0;bottom:0;padding:22px 10px 8px;font-size:11.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.62));opacity:0;transition:opacity .12s;text-align:left}
  .cell:hover .hover-meta{opacity:1}
  .star{position:absolute;top:8px;right:8px;color:var(--star);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  /* honest in-flight: shimmer + elapsed, never a fake percent */
  .cell.running{aspect-ratio:4/5}
  .shimmer{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb, var(--gold) 14%, transparent) 50%,transparent 70%);background-size:220% 100%;animation:sh 1.6s linear infinite}
  @keyframes sh{from{background-position:180% 0}to{background-position:-80% 0}}
  .running .tag{position:absolute;left:10px;bottom:10px;font:500 11px ui-monospace,monospace;color:var(--fg2);background:var(--scrim);border:1px solid var(--line);border-radius:6px;padding:3px 7px;backdrop-filter:blur(4px)}
  .cell.failed{aspect-ratio:4/5;border-style:dashed;background:none}
  .cell.failed .fmsg{position:absolute;inset:0;display:grid;place-content:center;gap:6px;justify-items:center;color:var(--fg3);font-size:12px}
  .fmsg .retry{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--fg)}
  .fmsg .retry:hover{background:var(--hover)}

  /* ---------- floating composer bar ---------- */
  .composer-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:50;width:min(720px,calc(100vw - 40px))}
  .composer{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r-bar);box-shadow:0 16px 44px rgba(0,0,0,.28);padding:12px 12px 10px}
  .brief{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:26px;padding:2px 4px 8px;font-size:13.5px}
  .brief .ph{color:var(--fg3)}
  .crow{display:flex;align-items:center;gap:8px}
  .attach{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--fg2)}
  .attach:hover{color:var(--fg);background:var(--hover)}
  .crow .grow{flex:1}
  .ghost-sel{display:inline-flex;align-items:center;gap:5px;border:none;background:none;font-size:12.5px;color:var(--fg2);padding:5px 6px}
  .ghost-sel:hover{color:var(--fg)}
  .stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 4px;font-size:12.5px;color:var(--fg2)}
  .stepper button{border:none;background:none;width:20px;height:20px;border-radius:50%;color:var(--fg2)}
  .stepper button:hover{background:var(--hover);color:var(--fg)}
  .go{width:34px;height:34px;border-radius:50%;border:none;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center}
  .go:hover{opacity:.88}
  .tip{margin-top:8px;text-align:center;font:11.5px ui-monospace,monospace;color:var(--fg3)}
  .tip button{border:none;background:none;font:inherit;color:var(--fg2);text-decoration:underline dotted}

  .theme-flip{position:fixed;right:16px;bottom:16px;z-index:60}
</style>
</head>
<body>

  <div class="topbar">
    <span class="wordmark">scenri

        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
