<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scenri v6 · Looks library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{ --r-card:12px; --gold:#f5c518; --gold-ink:#191300; }
  [data-theme="light"]{
    --bg:#ffffff; --panel:#ffffff; --raised:#f6f6f6; --line:#e8e8e8; --line-strong:#d4d4d4;
    --fg:#0a0a0a; --fg2:#666666; --fg3:#9a9a9a;
    --inv-bg:#0a0a0a; --inv-fg:#ffffff; --hover:#f4f4f4;
  
    --sb:rgba(10,10,10,.18); --sb-hover:rgba(10,10,10,.34);
  }
  [data-theme="dark"]{
    --bg:#0d0d0d; --panel:#141414; --raised:#1a1a1a; --line:#262626; --line-strong:#383838;
    --fg:#f5f5f5; --fg2:#9a9a9a; --fg3:#6b6b6b;
    --inv-bg:#f5f5f5; --inv-fg:#0d0d0d; --hover:#1c1c1c;
  
    --sb:rgba(245,245,245,.20); --sb-hover:rgba(245,245,245,.36);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 'Inter Tight',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;cursor:pointer}
  svg{display:block}

  /* ---------- scrollbars: part of the page, never louder than it ----------
     Thin, no track, thumb tinted from the theme's own line color and only
     fully visible while the pointer is over the scrollable area. Firefox gets
     the same treatment through scrollbar-color. */
  *{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--sb);border-radius:999px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--sb-hover);background-clip:content-box}


  /* ---------- chrome ---------- */
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;height:60px;padding:0 20px;background:var(--bg)}
  .wordmark{font:600 15px 'Inter Tight';letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .brand-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12.5px}
  .brand-dot{width:9px;height:9px;border-radius:3px;background:#f5a623}
  .nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
  .nav button{border:none;background:none;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:500;color:var(--fg2)}
  .nav button[data-active]{background:var(--inv-bg);color:var(--inv-fg);font-weight:600}
  .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .credits{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:none;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-weight:650;font-size:12.5px}
  .coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff3b0, #f0b90b 60%, #a67c00);box-shadow:inset 0 0 0 1.5px rgba(120,86,0,.55)}
  .icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg2)}
  .icon-btn:hover{background:var(--hover);color:var(--fg)}

  main{max-width:none;margin:0;padding:6px 22px 90px}

  /* ---------- verticals: a sticky rail that stays with you down the page ---------- */
  .verticals{position:sticky;top:60px;z-index:40;display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;
    padding:14px 0 15px;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:34px}
  .verticals::-webkit-scrollbar{display:none}
  .verticals button{border:none;background:none;padding:0;white-space:nowrap;font:400 19px 'Inter Tight';letter-spacing:-.01em;color:var(--fg3)}
  .verticals button:hover{color:var(--fg2)}
  .verticals button[data-on]{color:var(--fg);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px}

  /* ---------- a section: heading, its looks named in a line, then the pictures ---------- */
  .coll{margin-bottom:46px}
  .coll h2{font:600 21px 'Inter Tight';letter-spacing:-.02em;margin-bottom:7px}
  .names{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:14px}
  .names button{border:none;background:none;padding:0;font-size:12.5px;color:var(--fg3)}
  .names button:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px}

  /* dense masonry: heights interlock, gutters stay tight, nothing is written on a picture */
  .masonry{columns:6;column-gap:10px}
  .look{position:relative;break-inside:avoid;margin:0 0 10px;width:100%;display:block;padding:0;border:none;
    border-radius:var(--r-card);overflow:hidden;background:var(--raised);line-height:0}
  .look img{width:100%;display:block;object-fit:cover;transition:transform .45s cubic-bezier(.2,.6,.2,1)}
  .look:hover img{transform:scale(1.03)}
  .look.t-tall img{aspect-ratio:4/5}
  .look.t-square img{aspect-ratio:1}
  .look.t-portrait img{aspect-ratio:3/4}
  .look.t-wide img{aspect-ratio:4/3}
  .veil{position:absolute;inset:0;opacity:0;transition:opacity .16s ease;
    background:linear-gradient(to top, rgba(0,0,0,.74) 0%, rgba(0,0,0,.26) 36%, rgba(0,0,0,0) 64%)}
  .use{position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);opacity:0;white-space:nowrap;
    transition:opacity .16s ease,transform .16s ease;background:#fff;color:#0a0a0a;border-radius:999px;padding:7px 17px;font:600 12px/1 'Inter Tight'}
  .cap{position:absolute;left:13px;right:13px;bottom:12px;opacity:0;transform:translateY(4px);
    transition:opacity .16s ease,transform .16s ease;line-height:1.35;text-align:left}
  .cap b{display:block;color:#fff;font:600 13px 'Inter Tight'}
  .cap span{display:block;font:11.5px 'Inter Tight';color:rgba(255,255,255,.68);margin-top:2px}
  .look:hover .veil,.look:focus-visible .veil{opacity:1}
  .look:hover .use,.look:focus-visible .use{opacity:1;transform:translate(-50%,-50%)}
  .look:hover .cap,.look:focus-visible .cap{opacity:1;transform:none}
  .look:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

  .theme-flip{position:fixed;right:16px;bottom:16px;z-index:60}

  @media (max-width:1800px){ .masonry{columns:5} }
  @media (max-width:1400px){ .masonry{columns:4} }
  @media (max-width:1100px){ .masonry{columns:3} }
  @media (max-width:760px){ .masonry{columns:2} .nav{display:none} .verticals button{font-size:16px} }
  @media (max-width:460px){ .masonry{columns:1} }
</style>
</head>
<body>

  <div class="topbar">
    <span class="wordmark">scenri
      <button class="brand-pill"><span class="brand-dot"></span>Stripe</button>
    </span>
    <nav class="nav">
      <button>Home</button>
      <button>Create</button>
      <button data-active>Looks</button>
      <button>Brand</button>
    </nav>
    <div class="right">
      <button class="credits"><span class="coin"></span>228 left</button>
      <button class="icon-btn" title="Theme"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
      <button class="icon-btn" title="Settings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M4.9 19.1l2.1-2.1m10-10 2.1-2.1"/></svg></button>
    </div>
  </div>

      <button>Apparel</button>

      <button>Accessories</button>

          <span class="cap"><b>Morning Tabletop</b><span>Low window light</span></span>

        <button class="look t-wide">

          <span class="veil"></span><span class="use">Use this look</span>
          <span class="cap"><b>Morning Tabletop</b><span>Low window light</span></span>

        <button class="look t-square">

    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
