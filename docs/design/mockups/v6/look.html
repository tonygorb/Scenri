<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scenri v6 · Look page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#f5c518; --gold-ink:#191300; }
  [data-theme="light"]{
    --bg:#ffffff; --panel:#ffffff; --raised:#f6f6f6; --line:#e8e8e8; --line-strong:#d4d4d4;
    --fg:#0a0a0a; --fg2:#666666; --fg3:#9a9a9a;
    --inv-bg:#0a0a0a; --inv-fg:#ffffff; --hover:#f4f4f4;
  
    --sb:rgba(10,10,10,.18); --sb-hover:rgba(10,10,10,.34);
  }
  [data-theme="dark"]{
    --bg:#0d0d0d; --panel:#141414; --raised:#1a1a1a; --line:#262626; --line-strong:#383838;
    --fg:#f5f5f5; --fg2:#9a9a9a; --fg3:#6b6b6b;
    --inv-bg:#f5f5f5; --inv-fg:#0d0d0d; --hover:#1c1c1c;
  
    --sb:rgba(245,245,245,.20); --sb-hover:rgba(245,245,245,.36);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 'Inter Tight',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;cursor:pointer}
  svg{display:block}

  /* ---------- scrollbars: part of the page, never louder than it ----------
     Thin, no track, thumb tinted from the theme's own line color and only
     fully visible while the pointer is over the scrollable area. Firefox gets
     the same treatment through scrollbar-color. */
  *{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--sb);border-radius:999px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--sb-hover);background-clip:content-box}

  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;height:60px;padding:0 20px;background:var(--bg)}
  .wordmark{font:600 15px 'Inter Tight';letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .brand-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12.5px}
  .brand-dot{width:9px;height:9px;border-radius:3px;background:#f5a623}
  .nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
  .nav button{border:none;background:none;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:500;color:var(--fg2)}
  .nav button[data-active]{background:var(--inv-bg);color:var(--inv-fg);font-weight:600}
  .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .credits{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:none;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-weight:650;font-size:12.5px}
  .coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff3b0, #f0b90b 60%, #a67c00);box-shadow:inset 0 0 0 1.5px rgba(120,86,0,.55)}
  .icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg2)}
  .icon-btn:hover{background:var(--hover);color:var(--fg)}

  /* ---------- one centered column, the pictures do the talking ---------- */
  main{max-width:980px;margin:0 auto;padding:26px 24px 120px;text-align:center}

  .crumb{display:flex;justify-content:center;align-items:center;gap:7px;color:var(--fg3);font:11.5px 'Inter Tight';margin-bottom:26px}
  .crumb button{border:none;background:none;padding:0;color:var(--fg3);font:inherit}
  .crumb button:hover{color:var(--fg)}

  h1{font:600 46px/1.05 'Inter Tight';letter-spacing:-.03em;margin-bottom:14px}
  h1 em{font:500 italic 49px 'Playfair Display';letter-spacing:0}
  .lede{color:var(--fg2);font-size:14.5px;line-height:1.65;max-width:50ch;margin:0 auto 26px}
  .facts{font:12px 'Inter Tight';color:var(--fg3);margin-bottom:28px}
  .facts i{font-style:normal;color:var(--line-strong);margin:0 8px}

  .acts{display:flex;justify-content:center;gap:9px;margin-bottom:40px}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid transparent;font-weight:600;height:40px;padding:0 21px;font-size:13.5px}
  .btn-primary{background:var(--inv-bg);color:var(--inv-fg)}
  .btn-primary:hover{opacity:.88}

  /* ---------- image rows ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:64px}
  .tile{position:relative;border:none;border-radius:12px;overflow:hidden;background:var(--raised);padding:0;display:block;width:100%;line-height:0}
  .tile img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;transition:transform .4s cubic-bezier(.2,.6,.2,1)}
  .tile:hover img{transform:scale(1.03)}
  .veil{position:absolute;inset:0;opacity:0;transition:opacity .16s ease;
    background:linear-gradient(to top, rgba(0,0,0,.7) 0%, rgba(0,0,0,.24) 38%, rgba(0,0,0,0) 66%)}
  .cap{position:absolute;left:13px;right:13px;bottom:12px;opacity:0;transform:translateY(4px);
    transition:opacity .16s ease,transform .16s ease;line-height:1.35;text-align:left}
  .cap b{display:block;color:#fff;font:600 12.5px 'Inter Tight'}
  .cap span{display:block;font:11.5px 'Inter Tight';color:rgba(255,255,255,.66);margin-top:2px}
  .tile:hover .veil,.tile:focus-visible .veil{opacity:1}
  .tile:hover .cap,.tile:focus-visible .cap{opacity:1;transform:none}
  .tile:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

  /* one quiet line per band: a marker, not a heading. the pictures stay on top */
  .bandhead{font:400 19px 'Inter Tight';letter-spacing:-.01em;color:var(--fg);margin-bottom:18px}

  /* ---------- sliders: the row keeps going, and the edges dissolve instead of cutting ---------- */
  .slider{position:relative;margin-bottom:64px}
  .track{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:0 1px}
  .track::-webkit-scrollbar{display:none}
  .track > *{flex:0 0 calc((100% - 36px)/3.35)}
  .slider::before,.slider::after{content:"";position:absolute;top:0;bottom:0;width:64px;z-index:2;pointer-events:none;transition:opacity .2s ease}
  .slider::before{left:-1px;background:linear-gradient(to right, var(--bg) 12%, color-mix(in srgb, var(--bg) 55%, transparent) 55%, transparent 100%)}
  .slider::after{right:-1px;background:linear-gradient(to left, var(--bg) 12%, color-mix(in srgb, var(--bg) 55%, transparent) 55%, transparent 100%)}
  .arrow{position:absolute;top:calc(50% - 18px);transform:translateY(-50%);z-index:3;width:34px;height:34px;display:grid;place-items:center;
    border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg2);opacity:0;transition:opacity .16s ease}
  .slider:hover .arrow{opacity:1}
  .arrow:hover{color:var(--fg);border-color:var(--line-strong)}
  .arrow.prev{left:-6px}
  .arrow.next{right:-6px}
  .arrow:focus-visible{opacity:1;outline:2px solid var(--fg);outline-offset:2px}
  /* the look's own reference frames: square, clean, and not clickable. they are the look, not your work */
  .tiles.gallery{grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .tiles.gallery .ref{border-radius:12px;overflow:hidden;background:var(--raised);line-height:0}
  .tiles.gallery img{aspect-ratio:1;width:100%;object-fit:cover;display:block}
  .tiles.gallery .ref.more{display:none}
  .gallery[data-open] .ref.more{display:block}
  .expand{display:block;margin:0 auto 74px;border:1px solid var(--line);background:none;border-radius:999px;height:32px;padding:0 16px;font:600 12px 'Inter Tight';color:var(--fg2)}
  .expand:hover{background:var(--hover);color:var(--fg);border-color:var(--line-strong)}

  /* the related row keeps its names in the open: these are peers you choose between */
  .named .tile{background:none}
  .named figcaption{padding:9px 2px 0;text-align:left;line-height:1.4}
  .named b{display:block;font:600 12.5px 'Inter Tight';color:var(--fg)}
  .named span{display:block;font:11.5px 'Inter Tight';color:var(--fg3);margin-top:2px}
  figure{margin:0}

  .theme-flip{position:fixed;right:16px;bottom:16px;z-index:60}

  @media (max-width:820px){
    h1{font-size:34px} h1 em{font-size:37px}
    .tiles{grid-template-columns:repeat(2,1fr)}
    .nav{display:none}
  }
</style>
</head>
<body>

  <div class="topbar">
    <span class="wordmark">scenri
      <button class="brand-pill"><span class="brand-dot"></span>Stripe</button>
    </span>
    <nav class="nav">
      <button>Home</button>
      <button>Create</button>
      <button data-active>Looks</button>
      <button>Brand</button>
    </nav>
    <div class="right">
      <button class="credits"><span class="coin"></span>228 left</button>
      <button class="icon-btn" title="Theme"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
      <button class="icon-btn" title="Settings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M4.9 19.1l2.1-2.1m10-10 2.1-2.1"/></svg></button>
    </div>
  </div>

  <main>

    <div class="acts">

    </div>

    <div class="tiles gallery" id="refs">
      <div class="ref"><img src="http://127.0.0.1:4747/api/look-previews/morning-tabletop/ref-01.jpg" alt=""></div>
      <div class="ref"><img src="http://127.0.0.1:4747/api/look-previews/morning-tabletop/ref-02.jpg" alt=""></div>
      <div class="ref"><img src="http://127.0.0.1:4747/api/look-previews/morning-tabletop/ref-03.jpg" alt=""></div>
      <div class="ref more"><img src="http://127.0.0.1:4747/api/look-previews/morning-tabletop/ref-04.jpg" alt=""></div>

    <p class="bandhead">Your shots in this look</p>
    <div class="slider">
      <button class="arrow prev" onclick="slide('made',-1)" aria-label="Previous"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="arrow next" onclick="slide('made',1)" aria-label="Next"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg></button>
      <div class="track" id="made">
        <button class="tile"><img src="http://127.0.0.1:4747/api/template-previews/device-on-stone.jpg" alt=""><span class="veil"></span><span class="cap"><b>@Analytics laptop</b><span>+ @Danna</span></span></button>
        <button class="tile"><img src="http://127.0.0.1:4747/api/template-previews/brand-gradient.jpg" alt=""><span class="veil"></span><span class="cap"><b>@Studio headphones</b><span>brand palette</span></span></button>
        <button class="tile"><img src="http://127.0.0.1:4747/api/template-previews/square-headline.jpg" alt=""><span class="veil"></span><span class="cap"><b>@Trail runner</b><span>+ @Marco</span></span></button>
        <button class="tile"><img src="http://127.0.0.1:4747/api/template-previews/knolled-flat-lay.jpg" alt=""><span class="veil"></span><span class="cap"><b>@Card wallet</b><span>+ @Marco</span></span></button>

      <button class="arrow prev" onclick="slide('near',-1)" aria-label="Previous"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="arrow next" onclick="slide('near',1)" aria-label="Next"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg></button>
      <div class="track" id="near">
        <figure><button class="tile"><img src="http://127.0.0.1:4747/api/template-previews/seamless-sweep.jpg" alt=""></button>

  </main>

  <script>
    // A true loop, not a rewind: the run is cloned once, and we teleport across the
    // seam where the two copies meet. Identical pixels either side, so the jump is invisible.
    document.querySelectorAll('.track').forEach((t) => {
      t.innerHTML += t.innerHTML;
      t.addEventListener('scroll', () => {
        clearTimeout(t._settle);
        t._settle = setTimeout(() => { if (!t._busy) seam(t); }, 90);
      }, { passive: true });
    });

    function seam(t){
      const run = t.scrollWidth / 2;
      if (t.scrollLeft >= run) t.scrollLeft -= run;
      else if (t.scrollLeft <= 1) t.scrollLeft += run;
    }

    function slide(id, dir){
      const t = document.getElementById(id);
      const step = t.firstElementChild.getBoundingClientRect().width + 12;
      const run = t.scrollWidth / 2;
      // going left from the head: hop into the clone first, so there is always track behind us
      if (dir < 0 && t.scrollLeft < step) t.scrollLeft += run;
      glide(t, t.scrollLeft + dir * step, run);
    }

    function glide(t, to, run){
      const from = t.scrollLeft, delta = to - from, start = performance.now(), ms = 420;
      t._busy = true;
      (function step(now){
        const p = Math.min(1, (now - start) / ms);
        t.scrollLeft = from + delta * (1 - Math.pow(1 - p, 3));
        if (p < 1) requestAnimationFrame(step);
        else { t._busy = false; if (t.scrollLeft >= run) t.scrollLeft -= run; }
      })(start);
    }
  </script>

  <button class="theme-flip icon-btn" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'" title="Flip theme">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</body>
