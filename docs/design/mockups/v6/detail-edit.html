<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scenri v6 · Detail overlay, text editing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{ --r-card:14px; --gold:#f5c518; --gold-ink:#191300; }
  [data-theme="light"]{
    --bg:#fafafa; --panel:#ffffff; --raised:#f1f1f1; --line:#e5e5e5; --line-strong:#d4d4d4;
    --fg:#0a0a0a; --fg2:#666666; --fg3:#9a9a9a;
    --inv-bg:#0a0a0a; --inv-fg:#ffffff; --hover:#f1f1f1;
  
    --sb:rgba(10,10,10,.18); --sb-hover:rgba(10,10,10,.34);
  }
  [data-theme="dark"]{
    --bg:#0a0a0a; --panel:#141414; --raised:#1a1a1a; --line:#262626; --line-strong:#383838;
    --fg:#f5f5f5; --fg2:#9a9a9a; --fg3:#6b6b6b;
    --inv-bg:#f5f5f5; --inv-fg:#0d0d0d; --hover:#1c1c1c;
  
    --sb:rgba(245,245,245,.20); --sb-hover:rgba(245,245,245,.36);
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 'Inter Tight',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:inherit;color:inherit;cursor:pointer}
  svg{display:block}

  /* ---------- scrollbars: part of the page, never louder than it ----------
     Thin, no track, thumb tinted from the theme's own line color and only
     fully visible while the pointer is over the scrollable area. Firefox gets
     the same treatment through scrollbar-color. */
  *{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--sb);border-radius:999px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--sb-hover);background-clip:content-box}

  .overlay{display:grid;grid-template-columns:86px 1fr 340px;height:100vh}
  .winbar{position:fixed;top:14px;left:14px;z-index:20;display:flex;gap:6px}
  .icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg2)}
  .icon-btn:hover{background:var(--hover);color:var(--fg)}

  .strip{padding:64px 0 20px;display:flex;flex-direction:column;align-items:center;overflow-y:auto;opacity:.4}
  .strip .lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin-bottom:8px}
  .fr{width:56px;height:56px;flex:none;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--raised);padding:0}
  .fr img{width:100%;height:100%;object-fit:cover;display:block}
  .fr[data-current]{width:64px;height:64px;border:2px solid var(--fg)}
  .wire{width:1px;height:14px;background:var(--line-strong)}

  .stage{display:grid;place-items:center;position:relative;padding:56px 28px 28px}
  .editing-tag{position:absolute;top:18px;left:50%;transform:translateX(-50%);font:500 11.5px ui-monospace,monospace;color:var(--gold-ink);background:var(--gold);border-radius:999px;padding:4px 13px;z-index:5}
  .frame{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.4);max-height:calc(100vh - 110px)}
  .frame img{display:block;max-height:calc(100vh - 112px);max-width:100%}
  .layer{position:absolute;color:#fff;font-family:'Inter Tight';text-shadow:0 2px 10px rgba(0,0,0,.45);cursor:move;white-space:pre-wrap}
  .layer.sel{outline:1.5px solid #fff;outline-offset:4px}
  .h{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid #333}
  .h.l{left:-9px;top:50%;transform:translateY(-50%)}
  .h.r{right:-9px;top:50%;transform:translateY(-50%)}
  .snapline{position:absolute;left:50%;top:0;bottom:0;width:1px;background:color-mix(in srgb, var(--gold) 70%, transparent)}

  .meta{border-left:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;padding:18px 18px 16px}
  .tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tabs button{border:none;background:none;padding:0 2px 10px;font-size:13px;color:var(--fg2);border-bottom:1.5px solid transparent;margin-bottom:-1px}
  .tabs button[data-on]{color:var(--fg);font-weight:600;border-bottom-color:var(--fg)}

  .layers{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:16px;overflow:hidden}
  .lrow{display:flex;align-items:center;gap:9px;padding:10px 12px;font-size:12.5px}
  .lrow + .lrow{border-top:1px solid var(--line)}
  .lrow[data-on]{background:var(--raised);font-weight:600}
  .lrow .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow .del{border:none;background:none;color:var(--fg3);padding:0}
  .lrow .del:hover{color:var(--fg)}
  .addlayer{display:flex;align-items:center;gap:7px;width:100%;border:none;background:none;padding:10px 12px;font-size:12.5px;color:var(--fg2);border-top:1px solid var(--line)}
  .addlayer:hover{background:var(--hover);color:var(--fg)}

  .prop{display:grid;grid-template-columns:86px 1fr;gap:9px 12px;align-items:center;margin-bottom:14px}
  .prop label{font-size:11.5px;color:var(--fg2)}
  .psel{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:7px 11px;font-size:12.5px}
  .prop input[type=range]{accent-color:var(--fg);width:100%}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
  .seg button{border:none;background:none;border-radius:7px;padding:5px 10px;color:var(--fg2)}
  .seg button[data-on]{background:var(--raised);color:var(--fg)}
  .swrow{display:flex;gap:7px}
  .sw{width:22px;height:22px;border-radius:7px;border:1px solid var(--line);padding:0;background:none}
  .sw[data-on]{outline:2px solid var(--fg);outline-offset:1.5px}
  .fx{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .fxc{border:1px solid var(--line);border-radius:999px;background:none;padding:5px 13px;font-size:12px;color:var(--fg2)}
  .fxc:hover{color:var(--fg)}
  .fxc[data-on]{background:var(--inv-bg);color:var(--inv-fg);border-color:transparent;font-weight:600}

  .spacer{flex:1}
  .donebar{display:flex;gap:9px}
  .ghostb{flex:1;border:1px solid var(--line);background:none;border-radius:11px;padding:11px;font:600 12.5px 'Inter Tight'}
  .ghostb:hover{background:var(--hover)}
  .doneb{flex:1;border:none;background:var(--inv-bg);color:var(--inv-fg);border-radius:11px;padding:11px;font:600 12.5px 'Inter Tight'}
  .doneb:hover{opacity:.88}
  .exphint{font-size:11px;color:var(--fg3);text-align:center;margin-top:9px}

  .theme-flip{position:fixed;right:352px;bottom:16px;z-index:60}
</style>
</head>
<body>

  <div class="winbar">
    <button class="icon-btn" title="Close (esc)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>

  <div class="overlay">
    <div class="strip">
      <span class="lbl">Lineage</span>
      <button class="fr"><img src="http://127.0.0.1:4747/api/images/8292b1e3eade11fbaedb3f74d225b51c" alt=""></button>
      <span class="wire"></span>
      <button class="fr" data-current><img src="http://127.0.0.1:4747/api/images/ccb8fb48583b1711f1d63ba8fedcd0ff" alt=""></button>
    </div>

    <div class="stage">
      <span class="editing-tag">editing text · esc to finish</span>
      <div class="frame">
        <img src="http://127.0.0.1:4747/api/images/ccb8fb48583b1711f1d63ba8fedcd0ff" alt="">
        <span class="snapline"></span>
        <span class="layer sel" style="left:8%;top:10%;font-size:34px;font-weight:700;letter-spacing:.01em">SUMMER, SERVED COLD
          <span class="h l"></span><span class="h r"></span>
        </span>
        <span class="layer" style="left:8%;top:24%;font-size:15px;font-weight:500;opacity:.92">New citrus line, out now</span>
      </div>
    </div>

    <aside class="meta">
      <div class="tabs">
        <button data-on>Text</button>
        <button>Info</button>
      </div>

      <div class="layers">
        <div class="lrow" data-on>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M12 6v13"/></svg>
          <span class="t">SUMMER, SERVED COLD</span>
          <button class="del"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </div>
        <div class="lrow">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M12 6v13"/></svg>
          <span class="t">New citrus line, out now</span>
          <button class="del"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </div>
        <button class="addlayer"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Add text layer</button>
      </div>

      <div class="prop">
        <label>Font</label>
        <span class="psel">Inter Tight<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg></span>
        <label>Size</label>
        <input type="range" min="10" max="120" value="34">
        <label>Weight</label>
        <span class="seg"><button>400</button><button>500</button><button data-on>700</button></span>
        <label>Spacing</label>
        <input type="range" min="-2" max="12" value="1">
        <label>Align</label>
        <span class="seg">
          <button data-on><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h10M3 18h14"/></svg></button>
          <button><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M5 18h14"/></svg></button>
          <button><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M11 12h10M7 18h14"/></svg></button>
        </span>
        <label>Color</label>
        <span class="swrow">
          <button class="sw" data-on style="background:#ffffff"></button>
          <button class="sw" style="background:#111111"></button>
          <button class="sw" style="background:#f5a623" title="Primary"></button>
          <button class="sw" style="background:#424770" title="Secondary"></button>
          <button class="sw" style="background:#cad2d9" title="Accent"></button>
        </span>
      </div>

      <div class="fx">
        <button class="fxc" data-on>Caps</button>
        <button class="fxc" data-on>Shadow</button>
        <button class="fxc">Pill background</button>
        <button class="fxc">Outline</button>
      </div>

      <div class="spacer"></div>

      <div class="donebar">
        <button class="ghostb">Export PNG with text</button>
        <button class="doneb">Done</button>
      </div>
      <p class="exphint">Export renders exactly these layers into the pixels. What you see is the file.</p>
    </aside>
  </div>

  <button class="theme-flip icon-btn" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'" title="Flip theme">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</body>
</html>
