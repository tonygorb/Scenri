<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scenri · Home mockup (Vercel direction)</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --raised:#fafafa; --line:#eaeaea; --line-strong:#d4d4d4;
    --fg:#000000; --fg2:#666666; --fg3:#999999;
    --inv-bg:#000000; --inv-fg:#ffffff; --hover:#fafafa;
    --blue:#0070f3; --amber:#f5a623; --red:#e5484d; --well:#fafafa;
  }
  [data-theme="dark"]{
    --bg:#000000; --panel:#0a0a0a; --raised:#111111; --line:#262626; --line-strong:#333333;
    --fg:#ffffff; --fg2:#a1a1a1; --fg3:#7a7a7a;
    --inv-bg:#ffffff; --inv-fg:#000000; --hover:#111111;
    --blue:#52a8ff; --well:#0a0a0a;
  
    --sb:rgba(245,245,245,.20); --sb-hover:rgba(245,245,245,.36);
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .topbar{display:flex;align-items:center;gap:20px;height:56px;padding:0 24px;border-bottom:1px solid var(--line)}
  .wordmark{font-size:15px;font-weight:650;letter-spacing:-.02em}
  .wordmark span{color:var(--fg3);font-weight:650}
  .crumb-sep{color:var(--line-strong)}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:13px;cursor:pointer}
  .pill:hover{background:var(--hover)}
  .dot{width:8px;height:8px;border-radius:2px;background:#f5a623}
  .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .icon-btn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;color:var(--fg2)}
  .icon-btn:hover{background:var(--hover)}
  .spend{font-size:12px;color:var(--fg2);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
  main{max-width:1024px;margin:0 auto;padding:40px 24px 80px}
  .section{margin-bottom:44px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .sec-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .link{color:var(--blue);font-size:13px;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit}
  .link:hover{text-decoration:underline}
  .create{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .create-card{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;text-align:left;font-family:inherit;color:var(--fg);transition:border-color .12s}
  .create-card:hover{border-color:var(--fg)}
  .glyph{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;color:var(--fg)}
  .create-card b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .create-card small{color:var(--fg2);font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .proj{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);cursor:pointer;padding:0;text-align:left;font-family:inherit;color:var(--fg);transition:border-color .12s}
  .proj:hover{border-color:var(--fg)}
  .proj img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-bottom:1px solid var(--line)}
  .proj .meta{padding:10px 12px}
  .proj .meta b{font-size:13px;font-weight:500;display:block}
  .proj .meta small{color:var(--fg3);font-size:12px}
  .kit{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  .kit-row{display:flex;align-items:center;gap:16px;padding:16px 18px}
  .kit-row + .kit-row{border-top:1px solid var(--line)}
  .logo{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--raised)}
  .logo img{width:100%;height:100%;object-fit:contain;display:block}
  .kit b{font-size:13.5px;font-weight:600}
  .kit small{color:var(--fg2);font-size:12.5px;display:block;max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .swatches{display:flex;gap:6px;margin-left:auto}
  .sw{width:18px;height:18px;border-radius:4px;border:1px solid var(--line)}
  .btn{font:600 13px Inter,sans-serif;padding:7px 14px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .btn-primary{background:var(--inv-bg);color:var(--inv-fg)}
  .btn-primary:hover{opacity:.85}
  .btn-ghost{background:var(--panel);color:var(--fg);border-color:var(--line)}
  .btn-ghost:hover{background:var(--hover)}
  .prod-thumbs{display:flex;gap:6px}
  .prod-thumbs img{width:30px;height:30px;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
  svg{display:block}

  /* ---------- scrollbars: part of the page, never louder than it ----------
     Thin, no track, thumb tinted from the theme's own line color and only
     fully visible while the pointer is over the scrollable area. Firefox gets
     the same treatment through scrollbar-color. */
  *{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--sb);border-radius:999px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--sb-hover);background-clip:content-box}

</style>
</head>
<body>
  <div class="topbar">
    <span class="wordmark">scenri<span>·studio</span></span>
    <span class="crumb-sep">/</span>
    <button class="pill"><span class="dot"></span>Stripe<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="right">
      <button class="pill" style="border-radius:999px;font-weight:600;font-size:12px"><span style="width:12px;height:12px;border-radius:50%;background:conic-gradient(var(--fg) 0 76%, var(--line) 76% 100%)"></span>228 left</button>
      <button class="icon-btn" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'" title="Toggle theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </div>

  <main>
    <div class="section">
      <div class="sec-head"><span class="sec-title">Create</span></div>
      <div class="create">
        <button class="create-card">
          <span class="glyph"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.2 2.2m8.4 8.4 2.2 2.2M5.6 18.4l2.2-2.2m8.4-8.4 2.2-2.2"/></svg></span>
          <span><b>New photoshoot</b><small>Engineered template with your product</small></span>
        </button>
        <button class="create-card">
          <span class="glyph"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></span>
          <span><b>Start from scratch</b><small>Describe any visual in your own words</small></span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span class="sec-title">Projects</span><button class="link">+ New project</button></div>
      <div class="grid">
        <button class="proj">
          <img src="http://127.0.0.1:4747/api/images/b613e42a0af1a0086974d6a9b0389497" alt="">
          <span class="meta"><b>Project 1</b><small>11 iterations · today</small></span>
        </button>
        <button class="proj">
          <img src="http://127.0.0.1:4747/api/images/cb6414ace0c5a9a34bfd52bd3979fc95" alt="">
          <span class="meta"><b>Summer campaign</b><small>4 iterations · today</small></span>
        </button>
        <button class="proj">
          <img src="http://127.0.0.1:4747/api/images/ddafd344a7022b680519600efd5b0654" alt="">
          <span class="meta"><b>Label exploration</b><small>7 iterations · yesterday</small></span>
        </button>
        <button class="proj">
          <img src="http://127.0.0.1:4747/api/images/3243a25614a13ba3cfe0a914b8f6786e" alt="">
          <span class="meta"><b>Holiday teaser</b><small>2 iterations · Jul 28</small></span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span class="sec-title">Brand kit</span><button class="link">Edit brand</button></div>
      <div class="kit">
        <div class="kit-row">
          <span class="logo"><img src="http://127.0.0.1:4747/api/images/8d49f4741feb7dc6eb1f6dba87b0d702" alt=""></span>
          <span><b>Stripe</b><small>Stripe is a financial services platform that helps all types of businesses accept payments and manage money movement.</small></span>
          <span class="swatches">
            <span class="sw" style="background:#f5a623"></span>
            <span class="sw" style="background:#424770"></span>
            <span class="sw" style="background:#cad2d9"></span>
            <span class="sw" style="background:#929eaa"></span>
          </span>
        </div>
        <div class="kit-row">
          <span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);font-weight:600">Products</span>
          <span class="prod-thumbs">
            <img src="http://127.0.0.1:4747/api/images/b613e42a0af1a0086974d6a9b0389497" alt="">
          </span>
          <span style="margin-left:auto"><button class="btn btn-ghost">Manage products</button></span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
