<!doctype html>
<html lang="en">
<head>
  <title>One Solution for All Your Business Finances | Lucid</title>
  <meta name="description" content="Bookkeeping, taxes and CFO services in one place." />
  <meta property="og:image" content="https://cdn.lucid.example/social-card.jpg" />
  <link rel="icon" type="image/png" href="https://cdn.lucid.example/favicon.png" sizes="16x16" />
  <link rel="stylesheet" href="/assets/theme.css" />
  <style>
    :root { --brand-primary: #4d61fc; --brand-accent: oklch(0.62 0.24 350); --radius: 8px; }
    .btn-primary { background: var(--brand-primary); color: #ffffff; }
    .footnote { color: #303030; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/"><img src="/assets/lucid-logo.svg" alt="Lucid logo" width="180" height="48" /></a>
    <nav><a href="/pricing">Pricing</a></nav>
  </header>
  <main>
    <img src="/assets/hero-photo.jpg" alt="A team at a desk" width="1600" height="900" />
    <section class="client-logos">
      <img src="/assets/acme.png" alt="Acme" />
      <img src="/assets/globex.png" alt="Globex" />
      <img src="/assets/initech.png" alt="Initech" />
    </section>
  </main>
  <footer>
    <img src="/assets/social-facebook.svg" alt="Facebook" />
    <img src="https://www.facebook.com/tr?id=1&ev=PageView" width="1" height="1" alt="" />
  </footer>
</body>
</html>
