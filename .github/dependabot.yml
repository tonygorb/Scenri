version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Monthly, not weekly. A solo maintainer reviewing five dependency PRs a
    # week reviews none of them, and an ignored PR is worse than a late one:
    # it trains you to skim past the queue where a real problem will sit.
    # Security advisories do not wait for this schedule; they surface in the
    # Security tab independently.
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    # A major is a migration, not an upgrade: React 19 arrived as a routine
    # weekly PR and broke the build on a single changed prop type. Majors are
    # decisions, so they get made deliberately, by reading the release notes
    # and opening the PR by hand. Patches and minors still arrive on their own.
    #
    # Note this also applies to security updates, so a vulnerability that can
    # only be fixed by a major will show in the Security tab rather than as a
    # PR. That is the trade for a quiet inbox; drop this block to reverse it.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      # One PR per family instead of a dozen. A solo maintainer cannot review
      # fifteen dependency PRs a week, and unreviewed ones just rot.
      dev-tooling:
        patterns: ['@biomejs/*', 'typescript', 'vitest', 'tsx', '@types/*']
      playwright:
        patterns: ['@playwright/*', 'playwright']
      react:
        patterns: ['react', 'react-dom', '@radix-ui/*', '@phosphor-icons/*']
      fonts:
        patterns: ['@fontsource/*', '@fontsource-variable/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
