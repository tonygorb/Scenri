name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    # Not `closed`: a merged or abandoned pull request needs no signature, and
    # every close was firing a job that had nothing to do.
    types: [opened, synchronize]

# SAFETY: this uses `pull_request_target`, which runs with a writable token even
# for pull requests from forks. That is required for a CLA bot to comment, and it
# is only safe because this workflow never checks out or executes the pull
# request's code. Do not add `actions/checkout` here, and never add a `run:` step
# that interpolates `github.event.*` text: comment bodies and PR titles are
# attacker controlled. The one comparison below is an expression-level equality
# check, which is evaluated by GitHub and never reaches a shell.
permissions:
  actions: write
  # Write is required so the action can push signatures to cla-signatures.
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only act on PR comments, and only on the signature phrase. Without this
    # every comment on every issue would spin up a job.
    # Bots cannot sign a CLA and do not need to: Dependabot and release-please
    # open pull requests against this repo constantly, and every one of them
    # was starting a job whose only outcome was to do nothing.
    if: >
      !endsWith(github.actor, '[bot]') &&
      ((github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
       || github.event_name == 'pull_request_target')
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/tonygorb/scenri/blob/main/CLA.md
          # Dedicated branch so human CLA signatures never commit to main
          # (which would re-trigger release-please).
          branch: cla-signatures
          # Bots cannot sign a CLA. These are all first-party automation acting
          # on this repo's behalf, so there is no third-party copyright to assign.
          allowlist: tonygorb,dependabot[bot],github-actions[bot],scenri-release-bot[bot]
          custom-notsigned-prcomment: >
            Thank you for the pull request. scenri asks every contributor to sign its
            [Contributor License Agreement](https://github.com/tonygorb/scenri/blob/main/CLA.md)
            once. You keep the copyright in your contribution and every right to use it
            elsewhere. To sign, reply to this pull request with exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'CLA signed. Thank you.'
