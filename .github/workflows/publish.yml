name: Publish

# Deliberately triggered by the release itself, not by release-please's output.
#
# Coupling the publish to `release_created` meant one tool's edge case could
# leave a version tagged in the manifest but never published, with no way to
# finish the job (release-please#2214). A GitHub release is the fact that
# matters: whatever creates it — release-please, or a person — publishing
# follows.
on:
  release:
    types: [published]
  # Re-running a failed run replays that run's commit and its workflow file,
  # so a fix to this file can never reach it. This is the way to retry a
  # publish with the current workflow, against a tag that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.1.0'
        required: true

# Never two publishes at once, and never cancel one midway: a version can only
# be published once.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only version tags publish. The content archive lives on a non-version
    # release tag (content-latest) and must never trigger a package publish.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') }}
    permissions:
      contents: write # gh release edit, to put the written notes on the page
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tag, not the branch: publish exactly what was released.
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # No registry-url on purpose: it writes an .npmrc with
      # _authToken=${NODE_AUTH_TOKEN}, and with that variable unset npm treats
      # auth as configured-but-empty and never attempts the OIDC exchange.
      # Trusted publishing wants no auth config at all; the default registry
      # is already npmjs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing is an npm CLI feature and needs 11.5.1 or newer;
      # Node 22 still ships npm 10. Pinned to the 11 line rather than @latest:
      # npm 12 changed `pack --json`'s output shape and broke the pack-surface
      # guard mid-publish. A major bump here is a deliberate edit, not a drift.
      - name: Use an npm that can do trusted publishing
        run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # The golden prompt tests compile against the full imagery, same as CI.
      - name: Hydrate the content cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download content-latest --repo "$GITHUB_REPOSITORY" --pattern scenri-content.zip --dir "$RUNNER_TEMP"
          pnpm exec tsx packages/cli/scripts/pull-content.mts "$RUNNER_TEMP/scenri-content.zip"

      - name: Build the studio into the CLI bundle
        run: pnpm build

      # Stage the exact publish surface BEFORE the tests run: the packSurface
      # suite skips itself when dist/templates are not staged, which is exactly
      # how 0.1.x shipped its source maps. Build first, stage, then verify.
      - name: Stage the package
        run: node packages/cli/scripts/prepack.mjs

      # A version can only be published once and unpublishing is restricted
      # after 72 hours, so the one irreversible step checks for itself rather
      # than trusting a workflow that ran somewhere else.
      - name: Verify before publishing
        run: |
          pnpm typecheck
          pnpm exec biome ci .
          pnpm test

      # The tarball's exact file list, in the log, before the irreversible step.
      - name: Show the exact tarball contents
        working-directory: packages/cli
        run: npm pack --dry-run --ignore-scripts

      # No token. npm authenticates this workflow to the registry over OIDC
      # ("trusted publishing"), which npm now requires: tokens that bypass 2FA
      # are being restricted for direct publishing, so a CI token cannot be
      # made to work no matter how it is scoped.
      #
      # `npm publish`, not `pnpm publish`: OIDC lives in the npm CLI. The only
      # thing pnpm was doing that npm does not is rewriting `workspace:*`, and
      # every one of those is a devDependency, which consumers never install.
      #
      # Provenance is automatic under trusted publishing; the flag is not
      # needed and `id-token: write` above is what makes it possible.
      # --loglevel http keeps the OIDC token exchange visible in the log, so
      # an auth failure names itself instead of hiding behind a 404.
      - name: Publish scenri
        run: npm publish --access public --loglevel http
        working-directory: packages/cli

      # The human summary already exists as the What's New record shipped in
      # the build. Prepend it rather than writing the same sentences twice.
      - name: Put the written release notes on the release page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          written="$(pnpm exec tsx packages/cli/scripts/release-body.ts "$TAG")"
          if [ -z "$written" ]; then
            echo "no written record for $TAG — leaving the generated notes alone"
            exit 0
          fi
          gh release view "$TAG" --json body --jq .body > generated.md
          { printf '%s\n\n---\n\n' "$written"; cat generated.md; } > body.md
          gh release edit "$TAG" --notes-file body.md
