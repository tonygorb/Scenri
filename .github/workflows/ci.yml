name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A second push to a PR cancels the first run rather than queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Both finish, so a break tells you whether it is one version or the
      # runtime floor moving under you.
      fail-fast: false
      # The oldest Node still receiving patches, and the current active LTS.
      # Not a formality: better-sqlite3 and sharp are native modules with a
      # per-major ABI, and `npx scenri` runs on whatever Node a stranger has.
      # Node 20 was dropped once it went end-of-life (2026-04-30) — promising a
      # runtime that no longer gets security patches is worse than not.
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Test
        run: pnpm test

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    # Repo default GITHUB_TOKEN is contents/packages read only; gitleaks needs
    # pull-requests:read to list commits on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks needs history, not just the tip

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
