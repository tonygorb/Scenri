name: CI

on:
  # main only. Every other branch reaches main through a pull request, and
  # `pull_request` already covers those: naming a working branch here would run
  # the whole matrix twice for one push, under two concurrency keys that cannot
  # cancel each other.
  push:
    branches: [main]
  # The default types plus ready_for_review: draft pull requests skip the
  # browser suite, so the flip to ready has to fire a run that includes it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A manual full run, browser suite included, on any branch. No PR needed.
  workflow_dispatch:
  # The Windows desktop chain only, once a day.
  #
  # Its gate below is a diff gate, and the things that have actually broken it
  # are not diffs: a runner image rollout, a Node bump on the image, Windows
  # changing when it hands a console to a detached process. No file changes for
  # any of those, so nothing would run and the first sign would be a release.
  # This is the clock covering what the diff cannot.
  schedule:
    - cron: '17 4 * * *'

# On a pull request a second push cancels the first run rather than queueing
# behind it. One group covers the whole pipeline: everything in a superseded
# run was testing a stale commit, the browser suite included.
#
# On main nothing is superseded. Each merge is a different tree, and its run is
# the only test of that tree, because a pull request is tested against the main
# it saw, not the main it lands on. Cancelling there left a quarter of main's
# runs unfinished, so main queues instead: a running run always finishes, and
# a waiting one is only ever replaced by a newer merge, whose tree contains it.
#
# The nightly has a group of its own. Sharing main's let a 04:17 run and a
# merge cancel each other.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes anything: it type-checks, lints and runs tests. Stated
# rather than inherited, so a change to the repository default cannot silently
# hand these jobs a writable token.
permissions:
  contents: read

# Linux jobs name ubuntu-24.04, not ubuntu-latest, which is the same image today.
# The label moves to Ubuntu 26 from 2026-10-19, and the likeliest casualty is the
# browsers' OS dependencies. Moving is a deliberate edit here, tried on a pull
# request, not an image rollout that lands on a release day.
jobs:
  # Decides whether the browser suite is owed. One binary question: does any
  # changed file fall outside the docs-safe list below? Unknown events, API
  # errors, empty answers and oversized diffs all answer yes. Deny by default.
  changes:
    name: change classifier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.classify.outputs.e2e }}
      updater: ${{ steps.classify.outputs.updater }}
      desktop: ${{ steps.classify.outputs.desktop }}
    steps:
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          e2e=true
          updater=true
          desktop=true
          files=""
          case "$EVENT" in
            pull_request)
              files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') || files="__ERROR__"
              ;;
            push)
              # The non_fast_forward rule on main guarantees BEFORE...AFTER is
              # a clean ancestor range.
              files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename') || files="__ERROR__"
              ;;
            schedule)
              # The nightly is for the desktop chain and nothing else.
              echo "e2e=false" >> "$GITHUB_OUTPUT"
              echo "updater=false" >> "$GITHUB_OUTPUT"
              echo "desktop=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              files="__FORCE__"
              ;;
          esac
          count=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$files" != "__ERROR__" ] && [ "$files" != "__FORCE__" ] && [ "$count" -gt 0 ] && [ "$count" -lt 300 ]; then
            e2e=false
            updater=false
            desktop=false
            while IFS= read -r f; do
              case "$f" in
                # In a bash case pattern * matches "/" too, so these behave as
                # **-globs. Anything not listed is runtime by fallthrough:
                # code, templates, workflows, build configs, the lockfile,
                # specs. Dependabot is listed because its schedule and grouping
                # never reach the app; the workflows it opens PRs against are
                # not listed, and still pay for themselves.
                *.md) ;;
                docs/*) ;;
                LICENSE*|NOTICE) ;;
                .github/ISSUE_TEMPLATE/*) ;;
                .github/CODEOWNERS) ;;
                .github/dependabot.yml) ;;
                *) e2e=true ;;
              esac
              # The update loop is expensive (a real npm install) and blind to
              # everything outside the updater, so it runs only when the
              # updater's own surfaces move: the CLI (launcher, staging,
              # routes all live there), the update UI, its spec, or the two
              # workflows that define publishing and this gate.
              case "$f" in
                packages/cli/*) updater=true ;;
                apps/studio/src/app/UpdateCenter.tsx) updater=true ;;
                apps/studio/src/app/updateRules.ts) updater=true ;;
                apps/studio/src/views/settings/About.tsx) updater=true ;;
                apps/studio/e2e/updates.spec.ts) updater=true ;;
                apps/studio/src/app/desktopRules.ts) updater=true ;;
                apps/studio/e2e/desktop.spec.ts) updater=true ;;
                .github/workflows/ci.yml|.github/workflows/publish.yml) updater=true ;;
              esac
              # The Windows icon chain is a much smaller surface than the
              # updater's. It clicks a shortcut, reads it back through COM and
              # follows the bootstrap handoff, so what can break it is the
              # desktop code, the launcher assets and the dispatch that `open`
              # arrives through - not the catalog importer or the brief
              # compiler, which is what `packages/cli/*` also means. Measured
              # over the fifty commits of 0.9.3: thirty-one matched the updater
              # gate, nine touched anything below.
              case "$f" in
                packages/cli/src/desktop/*) desktop=true ;;
                packages/cli/launcher/*) desktop=true ;;
                packages/cli/src/launcher.ts) desktop=true ;;
                packages/cli/src/installKind.ts) desktop=true ;;
                packages/cli/src/index.ts) desktop=true ;;
                packages/cli/src/serve.ts) desktop=true ;;
                packages/cli/src/routes/desktop.ts) desktop=true ;;
                packages/cli/src/update/versionsDir.ts) desktop=true ;;
                packages/cli/test/manual-desktop-windows.mjs) desktop=true ;;
                apps/studio/src/app/desktopRules.ts) desktop=true ;;
                apps/studio/e2e/desktop.spec.ts) desktop=true ;;
                .github/workflows/ci.yml|.github/workflows/publish.yml) desktop=true ;;
              esac
              if [ "$e2e" = "true" ] && [ "$updater" = "true" ] && [ "$desktop" = "true" ]; then break; fi
            done <<< "$files"
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "updater=$updater" >> "$GITHUB_OUTPUT"
          if [ "$e2e" = "true" ]; then
            echo "Runtime change, full E2E required (update loop: $updater)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Change type: docs-only. E2E skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "e2e=$e2e updater=$updater for $count changed file(s):"
          printf '%s\n' "$files" | head -50

  check:
    name: typecheck, lint, test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Both finish, so a break tells you whether it is one version or the
      # runtime floor moving under you.
      fail-fast: false
      # The oldest Node still receiving patches, and the current active LTS.
      # Not a formality: better-sqlite3 and sharp are native modules with a
      # per-major ABI, and `npx scenri` runs on whatever Node a stranger has.
      # Node 20 was dropped once it went end-of-life (2026-04-30) — promising a
      # runtime that no longer gets security patches is worse than not.
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # No step pushes with git, so the token has no business sitting in
        # .git/config while dependency install scripts and tests run.
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm exec biome ci .

      # The repo deliberately carries only the catalog and its thumbnails; the
      # golden prompt tests compile against the full imagery, which lives in
      # the content archive. Contributors run the same hydration once:
      # pnpm exec tsx packages/cli/scripts/pull-content.mts
      - name: Hydrate the content cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download content-v3 --repo "$GITHUB_REPOSITORY" --pattern scenri-content.zip --dir "$RUNNER_TEMP"
          pnpm exec tsx packages/cli/scripts/pull-content.mts "$RUNNER_TEMP/scenri-content.zip"

      - name: Test
        run: pnpm test

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Repo default GITHUB_TOKEN is contents/packages read only; gitleaks needs
    # pull-requests:read to list commits on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks needs history, not just the tip
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows is a first-class install target (`npx scenri` on whatever machine
  # a stranger has), and nothing else in CI would notice a win32-only break:
  # .cmd shims, path separators, native-module prebuilds, process teardown.
  # Typecheck, the unit suites and a real boot answer most of that.
  windows:
    name: windows smoke
    needs: changes
    if: >-
      needs.changes.outputs.e2e == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Hydrate the content cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download content-v3 --repo "$env:GITHUB_REPOSITORY" --pattern scenri-content.zip --dir "$env:RUNNER_TEMP"
          pnpm exec tsx packages/cli/scripts/pull-content.mts "$env:RUNNER_TEMP/scenri-content.zip"

      - name: Test
        run: pnpm test

      # The one thing unit tests cannot prove: the server actually boots and
      # answers on Windows, sqlite and sharp prebuilds included.
      - name: Boot smoke test
        shell: pwsh
        run: |
          $env:SCENRI_HOME = Join-Path $env:RUNNER_TEMP 'scenri-smoke'
          $env:SCENRI_PORT = '4759'
          $env:SCENRI_HOST = '127.0.0.1'
          $env:SCENRI_NO_OPEN = '1'
          $env:SCENRI_NO_UPDATE_CHECK = '1'
          $env:SCENRI_NO_CONTENT_FETCH = '1'
          $env:SCENRI_DEMO_ENGINE = '1'
          $p = Start-Process node -ArgumentList '--import','tsx','packages/cli/src/index.ts','serve' -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..60) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:4759/api/version' -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            if ($p.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'Scenri did not answer /api/version on Windows' }

  # The desktop icon, clicked for real, plus the invariant a 0.9.2 tester lost
  # a running Scenri to: a launcher that cannot be written is a printed
  # sentence, never an exit. Every unit test of this chain mocks PowerShell, so
  # this is the only place it runs as a person meets it. Temporary, on the
  # windows-onboarding branch, the way PR #176 ran its own.
  windows-desktop:
    name: windows desktop icon
    needs: changes
    if: >-
      needs.changes.outputs.desktop == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The CLI serves the prebuilt studio and never builds it.
      - name: Build
        run: pnpm build

      # Only here, and never in the lockfile: the pseudo-console is the one way
      # to press a key at a prompt that requires a TTY, and no other job needs
      # it. --no-save keeps it out of pnpm's graph entirely.
      - name: A console to press keys at
        run: npm i --no-save --prefix "$env:RUNNER_TEMP/pty" node-pty@1.1.0

      - name: Click the icon
        env:
          SCENRI_PTY: ${{ runner.temp }}/pty/node_modules/node-pty/lib/index.js
        run: node packages/cli/test/manual-desktop-windows.mjs

      - name: Keep the launcher logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-desktop-logs
          path: ${{ runner.temp }}/sc-desktop/data/logs
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.name }})
    needs: changes
    # Skips only for the two intended reasons: a docs-only diff, or a draft
    # pull request (the flip to ready re-triggers via ready_for_review). The
    # gate refuses any other skip.
    if: >-
      needs.changes.outputs.e2e == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    # A healthy leg is minutes. Without this a hung browser holds a runner for
    # GitHub's six-hour default, which is how a broken suite turns into a bill.
    timeout-minutes: 20
    strategy:
      # Every leg finishes, so one flaky leg does not hide another's verdict.
      fail-fast: false
      matrix:
        include:
          # Legs run on separate runners so the wall clock is the slowest leg,
          # not the sum of the projects. A shard is a set of whole spec files
          # (fullyParallel is off, so a file never splits) and every file boots
          # its own server, so the split changes nothing about isolation.
          #
          # Five chromium shards, not two. Playwright divides shards by test
          # COUNT, never by duration, and the slow files sit together in the
          # alphabet: composer, conversation-motion and the create-presenter
          # family all landed in shard one, which ran 9.5 minutes against
          # 7.5 for shard two. Replaying Playwright 1.62's own split against
          # measured per-test times (checked within 6s of the real two-shard
          # legs on five runs) put three shards at 8.1 minutes, four at 7.1,
          # five at 5.6 with composer.spec alone as the floor, and six at 7.1
          # again because the count split leaves one shard empty. Revisit when
          # the slowest leg passes seven minutes; more shards is not always
          # faster.
          #
          # The tablet project is a real iPad, and an iPad is WebKit, so that
          # leg installs both engines. Installing only Chromium once made every
          # tablet test die on launch in a few milliseconds, which reads as 28
          # test failures rather than one missing browser.
          - name: chromium-1
            browsers: chromium
            args: --project=chromium --shard=1/5
          - name: chromium-2
            browsers: chromium
            args: --project=chromium --shard=2/5
          - name: chromium-3
            browsers: chromium
            args: --project=chromium --shard=3/5
          - name: chromium-4
            browsers: chromium
            args: --project=chromium --shard=4/5
          - name: chromium-5
            browsers: chromium
            args: --project=chromium --shard=5/5
          - name: mobile-tablet
            browsers: chromium webkit
            args: --project=mobile --project=tablet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # No step pushes with git, so the token has no business sitting in
        # .git/config while dependency install scripts and tests run.
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @scenri/studio exec node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser binaries change only when Playwright does; downloading
      # them fresh cost about 40 seconds on every run.
      #
      # The key names the browser set, because the legs install different
      # ones and a cache key is written once, by whichever job saves first.
      # Under one shared key the 1.62.1 cache happened to be saved by the
      # tablet leg, chromium and webkit both; had a chromium leg won the race,
      # the tablet leg would have restored a hit with no WebKit in it and
      # skipped the install.
      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browsers == 'chromium' && 'chromium' || 'chromium-webkit' }}

      # Both install steps carry their own timeout: apt behind them once hung
      # on a mirror for the full 20-minute job budget before any test ran.
      - name: Install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --filter @scenri/studio exec playwright install --with-deps ${{ matrix.browsers }}

      # The cache holds the binaries, not the OS packages they link against.
      - name: Install browser OS dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: pnpm --filter @scenri/studio exec playwright install-deps ${{ matrix.browsers }}

      - name: Build the studio
        run: pnpm build

      # The suite drives a real server on purpose: synthetic events cannot
      # reproduce focus or caret behaviour, so there is nothing to mock. Each
      # spec file starts and seeds a Scenri of its own on an empty home
      # (e2e/harness.ts), so there is no library to point anywhere and nothing
      # left behind to clean up.
      - name: Run Playwright
        run: pnpm --filter @scenri/studio exec playwright test ${{ matrix.args }}

      # Traces, not playwright-report: the reporter is `list`, so no HTML
      # report is ever written, and the trace is what shows the failing screen.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.name }}
          path: apps/studio/test-results/
          retention-days: 7

  # The updater is release-critical and its breakage is invisible to unit
  # tests (a tester found the dead buttons by hand). This is the real loop:
  # launcher supervising, fixture-registry check, background auto-stage with a
  # real npm install and the verify hop, exit-75 restart into 99.0.0, and the
  # library surviving. Gated to updater-relevant paths by the classifier so an
  # unrelated studio change does not pay for an npm install.
  update-loop:
    name: update loop
    needs: changes
    if: >-
      needs.changes.outputs.updater == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the studio
        run: pnpm build

      - name: Run the update loop
        run: node packages/cli/test/manual-update-loop.mjs

  # The one required status check on main. `always()` is load-bearing: without
  # it a failed upstream job would leave this job "skipped", and GitHub counts
  # a skipped required check as passing. The ruleset requires this job by its
  # literal name, so renaming "CI gate" without updating the ruleset leaves
  # every PR stuck waiting on a check that never reports.
  gate:
    name: CI gate
    needs: [changes, check, secrets, windows, windows-desktop, e2e, update-loop]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate
        env:
          CHANGES: ${{ needs.changes.result }}
          # Matrix jobs aggregate: success only when every leg passed.
          CHECK: ${{ needs.check.result }}
          SECRETS: ${{ needs.secrets.result }}
          WINDOWS: ${{ needs.windows.result }}
          WINDOWS_DESKTOP: ${{ needs.windows-desktop.result }}
          E2E: ${{ needs.e2e.result }}
          UPDATE_LOOP: ${{ needs.update-loop.result }}
          E2E_REQUIRED: ${{ needs.changes.outputs.e2e }}
          UPDATER_REQUIRED: ${{ needs.changes.outputs.updater }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          fail() { echo "::error::CI gate: $1"; exit 1; }
          [ "$CHANGES" = "success" ] || fail "change classifier: $CHANGES"
          [ "$CHECK" = "success" ] || fail "fast checks: $CHECK"
          [ "$SECRETS" = "success" ] || fail "secret scan: $SECRETS"
          # A skip is legitimate only when the job's own condition produced
          # it: its classifier output said no, or a draft PR. A skip caused by
          # the classifier failing is already fatal above.
          leg() { # name result required
            case "$2" in
              success) ;;
              skipped)
                if [ "$3" = "true" ] && [ "$DRAFT" != "true" ]; then
                  fail "$1 was required but did not run"
                fi
                echo "$1 skipped (not required or draft), acceptable"
                ;;
              *)
                fail "$1: $2"
                ;;
            esac
          }
          leg windows "$WINDOWS" "$E2E_REQUIRED"
          leg windows-desktop "$WINDOWS_DESKTOP" "$DESKTOP_REQUIRED"
          leg E2E "$E2E" "$E2E_REQUIRED"
          leg update-loop "$UPDATE_LOOP" "$UPDATER_REQUIRED"
          echo "All checks green."
