name: Release

on:
  push:
    branches: [main]
  # release-please refuses to open a new release PR while a merged one still
  # carries `autorelease: pending` — a state a hand-made GitHub release leaves
  # behind, because the tagging step that clears the label never ran. Fixing
  # that is a label edit, and without this there is no way to ask release-please
  # to look again except by pushing another commit to main.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One release-please run at a time: two pushes to main in quick succession
# would otherwise reason about the same state twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Versions are never typed by hand: release-please reads the conventional
# commits on main and opens a pull request carrying the bump and the CHANGELOG.
#
# `package-name` is deliberately empty in release-please-config.json. Two of
# release-please's own accessors disagree about the component: `getComponent()`
# honours `include-component-in-tag: false` and returns "", so the release PR
# body and the branch are written without one, while `getBranchComponent()`
# ignores that flag and derives "scenri" from the package name. On merge,
# strategies/base.ts compares the two, finds "undefined" against "scenri", and
# returns without creating the release — logging a warning while the job still
# reports success. That is why v0.1.0 and v0.1.1 both had to be tagged by hand.
# An empty package name makes both sides resolve to "", and the tag is
# unaffected because the component is already excluded from it.
#
# It does not publish. Publishing hangs off the `release: published` event in
# publish.yml, so whatever creates the GitHub release — this, or a person —
# the package still goes out verified and with provenance.
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The automatic GITHUB_TOKEN cannot open a pull request unless the repo
      # opts into "Actions can create and approve pull requests", and any PR it
      # did open would trigger no further workflows, so CI would never run on
      # the release PR. A short-lived App token has neither problem.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
