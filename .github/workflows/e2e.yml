name: E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/studio/**'
      - 'packages/cli/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer:
    name: composer caret and chips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @scenri/studio exec playwright install --with-deps chromium

      - name: Build the studio
        run: pnpm build

      # The suite drives a real server on purpose: synthetic events cannot
      # reproduce focus or caret behaviour, so there is nothing to mock. It
      # starts and seeds that server itself, from playwright.config.ts.
      - name: Run Playwright
        run: pnpm --filter @scenri/studio test:e2e
        env:
          SCENRI_E2E_HOME: ${{ runner.temp }}/scenri-e2e

      # Traces, not playwright-report: the reporter is `list`, so no HTML
      # report is ever written, and the trace is what shows the failing screen.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/studio/test-results/
          retention-days: 7
