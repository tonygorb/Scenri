name: E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/studio/**'
      - 'packages/cli/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer:
    name: composer caret and chips
    runs-on: ubuntu-latest
    # A healthy run is under two minutes. Without this a hung browser holds a
    # runner for GitHub's six-hour default, which is how a broken suite turns
    # into a bill.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium covers desktop and the Pixel 5 project; the tablet project is
      # a real iPad, and an iPad is WebKit. Installing only Chromium made every
      # tablet test die on launch in a few milliseconds, which reads as 28 test
      # failures rather than one missing browser.
      - name: Install browsers
        run: pnpm --filter @scenri/studio exec playwright install --with-deps chromium webkit

      - name: Build the studio
        run: pnpm build

      # The suite drives a real server on purpose: synthetic events cannot
      # reproduce focus or caret behaviour, so there is nothing to mock. It
      # starts and seeds that server itself, from playwright.config.ts.
      - name: Run Playwright
        run: pnpm --filter @scenri/studio test:e2e
        env:
          SCENRI_E2E_HOME: ${{ runner.temp }}/scenri-e2e

      # Traces, not playwright-report: the reporter is `list`, so no HTML
      # report is ever written, and the trace is what shows the failing screen.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/studio/test-results/
          retention-days: 7
