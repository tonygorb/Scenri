name: E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/studio/**'
      - 'packages/cli/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# The suite only reads the repo and drives a browser against a local server.
permissions:
  contents: read

jobs:
  composer:
    name: composer caret and chips
    runs-on: ubuntu-latest
    # A healthy run is under two minutes. Without this a hung browser holds a
    # runner for GitHub's six-hour default, which is how a broken suite turns
    # into a bill.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # No step pushes with git, so the token has no business sitting in
        # .git/config while dependency install scripts and tests run.
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium covers desktop and the Pixel 5 project; the tablet project is
      # a real iPad, and an iPad is WebKit. Installing only Chromium made every
      # tablet test die on launch in a few milliseconds, which reads as 28 test
      # failures rather than one missing browser.
      - name: Install browsers
        run: pnpm --filter @scenri/studio exec playwright install --with-deps chromium webkit

      - name: Build the studio
        run: pnpm build

      # The suite drives a real server on purpose: synthetic events cannot
      # reproduce focus or caret behaviour, so there is nothing to mock. Each
      # spec file starts and seeds a Scenri of its own on an empty home
      # (e2e/harness.ts), so there is no library to point anywhere and nothing
      # left behind to clean up.
      - name: Run Playwright
        run: pnpm --filter @scenri/studio test:e2e

      # Traces, not playwright-report: the reporter is `list`, so no HTML
      # report is ever written, and the trace is what shows the failing screen.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/studio/test-results/
          retention-days: 7
