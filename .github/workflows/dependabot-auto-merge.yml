name: dependabot auto-merge

# Dependabot opens the PR; this arms GitHub's auto-merge on it, so a patch or
# minor bump lands by itself once the required "CI gate" check is green. A red
# CI never merges, and majors are left alone: dependabot.yml already ignores
# them, and this is the second lock on that door.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  arm:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # A merge commit, never a squash: release-please reads every conventional
      # prefix (see the shipping skill).
      # Action bumps edit workflow files, which the workflow token is not allowed
      # to merge, so those stay a monthly merge by hand.
      - if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          steps.meta.outputs.package-ecosystem != 'github_actions'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
